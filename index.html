<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Penn State Go Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>

<script>
document.addEventListener("DOMContentLoaded", function () {

  // Create full-screen iframe
  const frame = document.createElement("iframe");
  frame.title = "watsonx-orchestrate-chat";
  frame.style.position = "fixed";
  frame.style.top = "0";
  frame.style.left = "0";
  frame.style.right = "0";
  frame.style.bottom = "0";
  frame.style.border = "0";
  frame.allow = "clipboard-read; clipboard-write; microphone; camera";

  document.body.appendChild(frame);

  const doc = frame.contentDocument;

  // Build minimal document inside iframe
  doc.open();
  doc.write(`
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="utf-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <style>
        html, body {
          height: 100%;
          margin: 0;
        }
        #WXOContainer {
          height: 100%;
        }
      </style>
    </head>
    <body>
      <div id="WXOContainer"></div>
    </body>
    </html>
  `);
  doc.close();

  const mount = doc.getElementById("WXOContainer");

  // Configure Watson
  frame.contentWindow.wxOConfiguration = {
    orchestrationID: "594368b649164c1eb07b9ac5f7f446df_a66215dd-36fd-4959-97bd-a0a103ed374d",
    hostURL: "https://us-south.watson-orchestrate.cloud.ibm.com",
    deploymentPlatform: "ibmcloud",
    crn: "crn:v1:bluemix:public:watsonx-orchestrate:us-south:a/594368b649164c1eb07b9ac5f7f446df:a66215dd-36fd-4959-97bd-a0a103ed374d::",
    chatOptions: {
      agentId: "c11ad89a-7918-4fe9-b070-51594af8b294",
      agentEnvironmentId: "c2aa993c-1b0a-4b62-81b7-153ea407a04a"
    },
    header: {
      showResetButton: true,
      showAiDisclaimer: true
    },
    style: {
      headerColor: "#1E407C",
      userMessageBackgroundColor: "#96BEE6",
      primaryColor: "#1E407C",
      showBackgroundGradient: true
    },
    layout: {
      form: "custom",
      customElement: mount,
      showOrchestrateHeader: true
    }
  };

  // Load IBM loader
  const s = doc.createElement("script");
  s.src = "https://us-south.watson-orchestrate.cloud.ibm.com/wxochat/wxoLoader.js?embed=true";
  s.onload = function () {
    frame.contentWindow.wxoLoader.init();
  };
  doc.head.appendChild(s);

});
</script>

</body>
</html>
